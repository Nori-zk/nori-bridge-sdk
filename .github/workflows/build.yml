name: Build nori-bridge-sdk

on:
  pull_request:
    types: [closed]
    branches:
      - build

jobs:
  build-nori-bridge-sdk:
    name: Build nori-bridge-sdk is a REN release, based on a pull request close (merge=true) event, with the branch 'build' as the PR target.
    if: github.event.pull_request.merged == true
    runs-on: [self-hosted, nori, highperf]
    permissions:
      contents: read
      pull-requests: write
    container:
      image: docker.nori.it.com/stacksmith:2.0.10
      volumes:
        # SSH for git operations
        - /home/runner/.ssh:/root/.ssh:ro
        
        # NPM registry auth
        - /home/runner/.npmrc:/github/home/.npmrc:ro

        # Stacksmith envs (used to enable specific pipelines which need env vars)
        - /home/runner/.stacksmith.envs:/root/.stacksmith.envs:ro

        # This makes the path consistent across parent and sibling containers
        - /tmp/stacksmith_repos:/tmp/stacksmith_repos

    timeout-minutes: 180

    # Define lightnet service
    services:
      mina-lightnet:
        image: o1labs/mina-local-network@sha256:b985f1cd8b4aee3e6fb3ac8f8d064235f33881fda3a41b4eb28a50ac15e276cf # mesa-latest-devnet
        env:
          RUN_ARCHIVE_NODE: true
          SLOT_TIME: 20000
          NETWORK_TYPE: single-node
          PROOF_LEVEL: full
          LOG_LEVEL: Trace
          PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/lib/postgresql/14/bin
          GOSU_VERSION: 1.19
          LANG: en_US.utf8
          PG_MAJOR: 14
          PG_VERSION: 14.21-1.pgdg12+1
          PGDATA: /var/lib/postgresql/data
          NODE_VERSION: 20.11.1
          MINA_DEB_NAME: mina-mesa
          MINA_COMMIT: aa93c44428e7c73cd7b77900634522108b746d18
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: archive

    steps:
      - name: Comment on PR - Build Started
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const commitUrl = `${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.merge_commit_sha }}`;
            const repoName = context.repo.repo;
            const message = `🔨 **Build started** for ${repoName}\n\n**Commit:** [\`${{ github.event.pull_request.merge_commit_sha }}\`](${commitUrl})\n**Workflow:** [View run details](${runUrl})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })

      - name: Cleanup job home cache
        run: |
          echo "Cleaning job home directory cache..."
          if [ -d "/__w/_temp/_github_home/.cache" ]; then
            rm -rf /__w/_temp/_github_home/.cache
            echo "Home cache cleaned"
          else
            echo "No cache found to clean"
          fi

      - name: Wait for lightnet to be ready
        shell: bash
        run: |
          apt-get update && apt install -y curl jq
          echo "⏳ Waiting for Mina lightnet to be ready..."
          for i in {1..60}; do
            if curl -sf http://mina-lightnet:8181/ > /dev/null; then
              echo "✅ Mina is ready!"
              echo "⏸️  Grace period: sleeping 60s for GraphQL (:8080) to settle..."
              sleep 60
              echo "▶️  Grace period complete."
              exit 0
            fi
            echo "Attempt $i/60 failed, waiting 10s..."
            sleep 10
          done
          echo "❌ Mina failed to become ready after 60 attempts (10 minutes)"
          exit 1

      - name: Run the nori-bridge-sdk workflow, run integration tests and build images.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          mkdir -p /tmp/stacksmith_repos
          stacksmith run bridge-sdk \
            --build-source-repo-pr-number ${{ github.event.pull_request.number }} \
            --build-source-repo ${{ github.event.repository.name }} \
            --build-id "nori-bridge-sdk-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_number }}" \
            --target-branch build \
            --envs-dir /root/.stacksmith.envs \
            --working-dir /tmp/stacksmith_repos

      - name: Comment on PR - Build Complete
        uses: actions/github-script@v7
        if: always()
        with:
          github-token: ${{ secrets.DISPATCH_TOKEN }}
          script: |
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const commitUrl = `${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.merge_commit_sha }}`;
            const repoName = context.repo.repo;
            let message;
            
            if ('${{ job.status }}' === 'success') {
              message = `✅ **Build succeeded** for ${repoName}\n\n**Commit:** [\`${{ github.event.pull_request.merge_commit_sha }}\`](${commitUrl})\n**Workflow:** [View run details](${runUrl})`;
            } else {
              message = `❌ **Build failed** for ${repoName}\n\n**Commit:** [\`${{ github.event.pull_request.merge_commit_sha }}\`](${commitUrl})\n**Workflow:** Check the [workflow run](${runUrl}) for details.\n\n⚠️ Review the logs to identify the failure cause.`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            })

      - name: Cleanup stacksmith working dir
        if: always()
        run: |
          stacksmith cleanup --working-dir /tmp/stacksmith_repos
          echo "Cleanup completed"

      - name: Cleanup job home cache
        if: always()
        run: |
          echo "Cleaning job home directory cache..."
          if [ -d "/__w/_temp/_github_home/.cache" ]; then
            rm -rf /__w/_temp/_github_home/.cache
            echo "Home cache cleaned"
          else
            echo "No cache found to clean"
          fi
